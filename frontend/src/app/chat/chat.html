<div class="chat">
  <h2>Tchat service client</h2>

  <div class="messages">
    @for (m of messages(); track m.id) {
      <div class="message">
        <span class="auteur">{{ m.expediteur }}</span>
        <span class="contenu">{{ m.contenu }}</span>
      </div>
    }
  </div>

  <div class="saisie">
    <input [(ngModel)]="expediteur" placeholder="Votre nom" />
    <input [(ngModel)]="contenu" placeholder="Votre message" (keyup.enter)="envoyer()" />
    <button (click)="envoyer()">Envoyer</button>
  </div>
</div>
